name: Archive NDIS Commission website

on:
  workflow_dispatch:
  schedule:
    - cron: "47 4 * * *"
      timezone: "Australia/Melbourne"

permissions:
  contents: write

concurrency:
  group: archive-writers
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python project/ndis_commission_tracker.py
        continue-on-error: true
      - name: Commit archive changes
        run: |
          git add archive/gov/ndis-commission
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "MyNDIS Archive Bot"
          git config user.email "myndiswiki@users.noreply.github.com"
          git commit -m "Archive NDIS Commission updates $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git pull --rebase
          git push
