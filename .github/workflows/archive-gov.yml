name: Archive government webpages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "project/gov_tracker.py"
      - "project/gov-sources.json"
      - "project/change_ledger.py"
      - "project/build_dashboard.py"
      - ".github/workflows/archive-gov.yml"
  schedule:
    - cron: "43 3 * * *"
      timezone: "Australia/Melbourne"

permissions:
  contents: write

concurrency:
  group: archive-writers
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run government webpage tracker
        run: python project/gov_tracker.py

      - name: Build archive change ledgers
        run: python project/change_ledger.py

      - name: Rebuild tracking dashboard
        run: python project/build_dashboard.py

      - name: Commit government archive changes
        shell: bash
        run: |
          git add archive/gov archive/reports
          if git diff --cached --quiet; then
            echo "No government webpage changes detected."
            exit 0
          fi

          git config user.name "MyNDIS Archive Bot"
          git config user.email "myndiswiki@users.noreply.github.com"
          git commit -m "Archive government webpage updates $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git pull --rebase
          git push
