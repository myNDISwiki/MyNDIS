name: Archive government webpages

on:
  workflow_dispatch:
  schedule:
    - cron: "43 3 * * *"
      timezone: "Australia/Melbourne"

permissions:
  contents: write

concurrency:
  group: archive-gov
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run government webpage tracker
        run: python project/gov_tracker.py

      - name: Commit government archive changes
        shell: bash
        run: |
          git add archive/gov
          if git diff --cached --quiet; then
            echo "No government webpage changes detected."
            exit 0
          fi

          git config user.name "MyNDIS Archive Bot"
          git config user.email "myndiswiki@users.noreply.github.com"
          git commit -m "Archive government webpage updates $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
