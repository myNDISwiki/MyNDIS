name: Build change history pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "archive/**/change-log.csv"
      - "archive/**/change-ledger.csv"
      - "project/build_change_pages.py"
      - ".github/workflows/build-change-pages.yml"

permissions:
  contents: write

concurrency:
  group: archive-writers
  queue: max
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync queued run with current main
        run: git pull --ff-only origin main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build archive and project change pages
        run: python project/build_change_pages.py
      - name: Build HTML tracking dashboard
        run: python project/build_dashboard.py
      - name: Commit generated pages
        run: |
          git add -A -- ':(glob)archive/**/changes.html' project/changes.html project/site/changes.html project/dashboard.html archive/reports/dashboard.json archive/reports/README.md
          if git diff --cached --quiet; then
            echo "No change pages changed."
            exit 0
          fi
          git config user.name "MyNDIS Archive Bot"
          git config user.email "myndiswiki@users.noreply.github.com"
          git commit -m "Build archive change history pages $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git pull --rebase origin main
          git push
