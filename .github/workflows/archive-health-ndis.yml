name: Archive Health NDIS material

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
      timezone: "Australia/Melbourne"

permissions:
  contents: write

concurrency:
  group: archive-health-ndis
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Health NDIS tracker
        run: python project/health_ndis_tracker.py
      - name: Commit Health NDIS archive changes
        shell: bash
        run: |
          git add archive/gov/health/ndis
          if git diff --cached --quiet; then
            echo "No Health NDIS changes detected."
            exit 0
          fi
          git config user.name "MyNDIS Archive Bot"
          git config user.email "myndiswiki@users.noreply.github.com"
          git commit -m "Archive Health NDIS updates $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
