name: Build MyNDIS wiki

on:
  push:
    branches: [main]
    paths:
      - "wiki/**"
      - ".github/workflows/wiki-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "wiki/**"
      - ".github/workflows/wiki-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: wiki/package.json

      - name: Install wiki dependencies
        working-directory: wiki
        run: npm install

      - name: Include NDIS archive in site build
        run: |
          mkdir -p wiki/static/archive
          cp -R archive/ndis wiki/static/archive/ndis

      - name: Build wiki
        working-directory: wiki
        run: npm run build
