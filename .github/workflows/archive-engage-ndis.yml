name: Archive Engage NDIS website
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'project/engage_ndis_tracker.py'
      - 'project/test_engage_ndis_tracker.py'
      - '.github/workflows/archive-engage-ndis.yml'
  schedule:
    - cron: "27 5 * * *"
      timezone: "Australia/Melbourne"
permissions:
  contents: write
concurrency:
  group: archive-writers
  queue: max
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Test credential redaction
        run: python -m unittest discover -s project -p 'test_engage_ndis_tracker.py'
      - run: python project/engage_ndis_tracker.py
        continue-on-error: true
      - run: |
          git add archive/gov/engage-ndis
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "MyNDIS Archive Bot"
          git config user.email "myndiswiki@users.noreply.github.com"
          git commit -m "Archive Engage NDIS updates $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git pull --rebase
          git push --force-with-lease
